services:
  sflogs:
    image: ${SFLOGS_IMAGE:-ghcr.io/sepehrfci/sflogs}:${SFLOGS_IMAGE_TAG:-v1.0.0}
    container_name: sflogs
    ports:
      - "5000:5000"
    environment:
      SFLOGS_DATABASE: /app/data/sflogs.sqlite3
      SFLOGS_SECRET_KEY: ${SFLOGS_SECRET_KEY:-}
      SFLOGS_USERNAME: ${SFLOGS_USERNAME:-}
      SFLOGS_PASSWORD: ${SFLOGS_PASSWORD:-}
      SFLOGS_COOKIE_SECURE: ${SFLOGS_COOKIE_SECURE:-false}
    volumes:
      - sflogs_data:/app/data
    restart: unless-stopped

